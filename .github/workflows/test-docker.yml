name: Test Docker Hub Login

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$USERNAME" || { echo "Username missing"; exit 1; }
          test -n "$TOKEN" || { echo "Token missing"; exit 1; }
          echo "Both secrets are available"

      - name: Login to Docker Hub
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          printf '%s' "$TOKEN" | docker login \
            -u "$USERNAME" --password-stdin

      - name: Pull ZMK image
        run: docker pull zmkfirmware/zmk-build-arm:stable
